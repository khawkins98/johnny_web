name: CI

on:
    pull_request:
        branches: [main]
    push:
        branches: [main]

jobs:
    test:
        runs-on: ubuntu-latest
        steps:
            - uses: actions/checkout@v6

            - uses: actions/setup-node@v6
              with:
                  node-version: 24

            - name: Install pnpm
              run: npm install --global pnpm@10.12.1

            - run: pnpm install --frozen-lockfile

            - name: Run unit tests
              run: pnpm test

            - name: Build
              run: pnpm run build
